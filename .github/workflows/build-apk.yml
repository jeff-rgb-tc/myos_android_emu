name: Build MyOS Emulator APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""
          for p in             "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"             "$SDK_ROOT/cmdline-tools/bin/sdkmanager"             "$SDK_ROOT/tools/bin/sdkmanager"
          do
            if [ -x "$p" ]; then
              SDKMANAGER="$p"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Find and extract MyOS project
        shell: bash
        run: |
          set -e

          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name 'myos-android-emulator-github.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: project ZIP not found"
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/extracted"

          ROOT="$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: Gradle project not found inside ZIP"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 4 -type f -print
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Gradle project: $ROOT"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"

          echo "Gradle version:"
          gradle --version

          echo "Project files:"
          find . -maxdepth 2 -type f -print | sort

          gradle assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT_ROOT" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced"
            find "$PROJECT_ROOT" -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myos-emulator-debug-apk
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
